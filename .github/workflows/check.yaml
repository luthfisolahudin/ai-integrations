name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Versions come from the repo, not from this file: .node-version pins Node
      # and package.json#devEngines.packageManager pins pnpm (version + integrity).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Conformance
        run: pnpm conformance

      - name: Symlink pair survived checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # One `git ls-files` per path on purpose: `git ls-files -s a, b` treats
          # "a, b" as a single literal path, matches nothing, and the check below
          # would silently pass.
          foreach ($path in 'CLAUDE.md', '.claude/skills') {
            $mode = git ls-files -s -- $path
            if (-not $mode) {
              Write-Error "$path is not in the index."
              exit 1
            }
            if ($mode -notmatch '^120000') {
              Write-Error "$path was checked out as a regular file; symlink support is required."
              exit 1
            }
          }
          Write-Output "CLAUDE.md and .claude/skills are symlinks"

  harness-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install OpenCode
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/opencode"
          gh release download v2.3.2 --repo anomalyco/opencode --pattern opencode-linux-x64.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/opencode-linux-x64.tar.gz" -C "$RUNNER_TEMP/opencode"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Exercise the generated checkout in both hosts
        run: pnpm run smoke
